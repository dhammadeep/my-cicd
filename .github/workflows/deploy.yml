name: Dev-my-cicd

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      git-ref:
        description: Git Ref (Optional)
        required: false

jobs:
  continuous-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and push Docker image
        run: |
          echo "Building and tagging image on $(date)"
          docker build -f Dockerfile -t ${{ secrets.DOCKER_HUB_USERNAME }}/my-cicd:latest .
          echo "Pushing the Docker image..."
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/my-cicd:latest

  continuous-deployment:
    runs-on: ubuntu-latest
    needs: continuous-integration

    steps:
      - name: Set up SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.EC2_SSH_KEY }}
          known_hosts: "add"

      - name: Add SSH Host Key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DEV_SSH_HOST }} >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to Droplet
        env:
          DOCKER_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/my-cicd:latest
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
        run: |
          echo "🚀 Executing deployment commands on remote server..."
          ssh $DEV_SSH_USER@$DEV_SSH_HOST << EOF
            set -e  # Exit on any error

            echo "🧹 Pruning unused Docker images..."
            docker image prune -a -f

            echo "⬇️ Pulling latest Docker image: ${DOCKER_IMAGE}"
            docker pull ${DOCKER_IMAGE}

            echo "🛑 Stopping existing container..."
            docker stop my-cicd || true

            echo "🗑️ Removing existing container..."
            docker rm my-cicd || true

            echo "🚀 Starting new container..."
            docker run -d \
              --name my-cicd \
              --restart unless-stopped \
              -p 8087:80 \
              ${DOCKER_IMAGE}

            echo "✨ Deployment completed successfully!"
          EOF
